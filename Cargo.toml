# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "crates/px13pen-core",
    "crates/px13pen-client",
    "crates/px13pend",
    "crates/px13penctl",
    "crates/px13pen-settings",
    "crates/px13pen-pair-helper",
    "crates/xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/gonzalezerik/px13-sa205h-linux"
description = "Linux support for MPP 2.6 haptic pens"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
