<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the activated unit (running as root) may own the helper's
       name, so a desktop process cannot serve itself and skip the
       polkit check. Anyone may call the helper; whether the call is
       honoured is polkit's decision, made per sender. -->
  <policy context="default">
    <deny own="org.openpenprotocol.PairHelper1"/>
    <allow send_destination="org.openpenprotocol.PairHelper1"
           send_interface="org.openpenprotocol.PairHelper1"/>
    <allow send_destination="org.openpenprotocol.PairHelper1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.openpenprotocol.PairHelper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.openpenprotocol.PairHelper1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy user="root">
    <allow own="org.openpenprotocol.PairHelper1"/>
    <allow send_destination="org.openpenprotocol.PairHelper1"/>
  </policy>
</busconfig>
