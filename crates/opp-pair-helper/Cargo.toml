[package]
name = "opp-pair-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-demand pairing helper for pens that never advertise"

[dependencies]
libc = "0.2"
zbus = "6.0.0"

# Lints are not inherited here: the management-channel binding needs a
# handful of unsafe syscalls, which the workspace-wide forbid disallows.
# Keep every unsafe line inside src/mgmt.rs; the daemon-facing code is
# safe Rust.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
